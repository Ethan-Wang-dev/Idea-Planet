services:
  - type: web
    name: idea-planet
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/v1/health
    disk:
      name: idea-planet-data
      mountPath: /app/.data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: IDEA_PLANET_DB
        value: /app/.data/idea-planet.sqlite
      - key: IDEA_PLANET_ALLOWED_ORIGIN
        sync: false
